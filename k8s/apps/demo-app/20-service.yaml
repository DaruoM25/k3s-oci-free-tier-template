apiVersion: v1
kind: Service
metadata:
  name: demo-app-web
  namespace: demo-app
  labels:
    app.kubernetes.io/name: demo-app-web
    app.kubernetes.io/component: web-service
    environment: production
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: demo-app-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
      protocol: TCP
