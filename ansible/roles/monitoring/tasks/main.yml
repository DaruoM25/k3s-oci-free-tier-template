---
# ==============================================================================
# Rôle Monitoring : Déploiement de Node Exporter (sur tous les nœuds)
# ==============================================================================

- name: Déterminer l'architecture matérielle pour le binaire
  ansible.builtin.set_fact:
    arch_suffix: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Créer le groupe système node_exporter
  ansible.builtin.group:
    name: node_exporter
    system: true
    state: present

- name: Créer l'utilisateur système node_exporter
  ansible.builtin.user:
    name: node_exporter
    group: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Vérifier si le binaire node_exporter est déjà installé
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_bin

- name: Télécharger et installer Prometheus Node Exporter
  when: not node_exporter_bin.stat.exists
  block:
    - name: Télécharger l'archive Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ arch_suffix }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: '0644'

    - name: Décompresser l'archive Node Exporter
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Copier le binaire dans /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ arch_suffix }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: node_exporter
        group: node_exporter
        mode: '0755'
        remote_src: true

    - name: Nettoyer les fichiers temporaires
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ arch_suffix }}"

- name: Déployer le service systemd pour Node Exporter
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify:
    - Recharger systemd
    - Redémarrer node_exporter

- name: S'assurer que Node Exporter est démarré et activé
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true

# Déploiement de la configuration Prometheus sur le Master
- name: Configurer le répertoire de configuration Prometheus sur le Master
  when: inventory_hostname in groups['k3s_master']
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    mode: '0755'

- name: Générer le fichier prometheus.yml sur le Master
  when: inventory_hostname in groups['k3s_master']
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: '0644'
